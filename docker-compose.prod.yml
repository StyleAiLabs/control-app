services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    command: ["./docker/start-prod-app.sh"]
    volumes:
      - storage-data:/var/www/html/storage
      - runtime-data:/var/www/html/runtime
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    command: ["./docker/start-prod-worker.sh"]
    volumes:
      - storage-data:/var/www/html/storage
      - runtime-data:/var/www/html/runtime
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sync360}
      POSTGRES_USER: ${DB_USERNAME:-sync360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sync360}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sync360} -d ${DB_DATABASE:-sync360}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  storage-data:
  runtime-data:
