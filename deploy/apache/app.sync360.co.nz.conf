<VirtualHost *:80>
    ServerName app.sync360.co.nz

    RewriteEngine On
    RewriteRule ^/(.*)$ https://app.sync360.co.nz/$1 [R=302,L]
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName app.sync360.co.nz

        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/app.sync360.co.nz/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/app.sync360.co.nz/privkey.pem

        ProxyPreserveHost On
        ProxyRequests Off

        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        RequestHeader set X-Forwarded-Host "app.sync360.co.nz"

        ProxyPass / http://127.0.0.1:8000/
        ProxyPassReverse / http://127.0.0.1:8000/

        ErrorLog ${APACHE_LOG_DIR}/sync360-control-app-error.log
        CustomLog ${APACHE_LOG_DIR}/sync360-control-app-access.log combined
    </VirtualHost>
</IfModule>
