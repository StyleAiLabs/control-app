services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: ["./docker/start-app.sh"]
    environment:
      SYNC360_INFRASTRUCTURE_DRIVER: local
      SYNC360_HOST_PROJECT_ROOT: ${PWD}
      SYNC360_HOST_PORT_PROBE_HOST: host.docker.internal
      SYNC360_LOCAL_DOCKER_COMPOSE_BIN: docker-compose
    volumes:
      - ./:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: ["./docker/start-worker.sh"]
    environment:
      SYNC360_INFRASTRUCTURE_DRIVER: local
      SYNC360_HOST_PROJECT_ROOT: ${PWD}
      SYNC360_HOST_PORT_PROBE_HOST: host.docker.internal
      SYNC360_LOCAL_DOCKER_COMPOSE_BIN: docker-compose
    volumes:
      - ./:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sync360
      POSTGRES_USER: sync360
      POSTGRES_PASSWORD: sync360
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync360 -d sync360"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
